    <link rel="stylesheet" href="./assets/css/global.css?v=4">

<body>
    <div class="preloader" id="preloader" aria-hidden="true">
        <div class="preloader-ring"><span>Loading</span></div>
    </div>
    <noscript><style>.preloader { display: none; }</style></noscript>

    <site-nav root="./"></site-nav>

    <div class="container main-content">
        <hero-section root="./" page="home"></hero-section>

        <div class="section-label" id="apps">Our Apps</div>

        <project-carousel root="./">
            <div class="glass-panel coming-soon">
                <p class="coming-soon-title">New apps are on the way</p>
                <p class="coming-soon-sub">We're preparing our first releases for Google Play, plus open-source projects on GitHub. Check back soon.</p>
            </div>
        </project-carousel>

        <div class="section-label" id="approach">How We Build</div>
        <p class="section-intro">Not every app follows the same model. Here's how OneDroid apps are offered.</p>

        <approach-grid root="./"></approach-grid>
    </div>

    <site-footer></site-footer>
